schemaVersion: "2"
kind: mixin
name: cdx-cld
version: "1.0.0"
displayName: Codex + Claude (Patronus harness)
description: Adds the Claude Code CLI to a Codex sandbox and installs the Patronus harness for both agents with a pinned patronus CLI.

requires:
  agent: codex

# Deny-by-default, with a curated allowlist. Widen host by host, not with "**".
# No anthropic credential block: an injected ANTHROPIC_API_KEY would override
# Claude's in-VM OAuth login.
permissions:
  network:
    allow:
      # Claude Code login, API and telemetry
      - "api.anthropic.com"
      - "*.anthropic.com"
      - "claude.com"
      - "*.claude.com"
      # Patronus catalog and the harness's hosted MCP servers
      - "registry.patronus.quasarops.com"
      - "api.githubcopilot.com"
      - "mcp.context7.com"
      # Code hosting (patronus and gitleaks releases, tk)
      - "github.com"
      - "*.github.com"
      - "**.githubusercontent.com"
      - "codeload.github.com"
      - "gitlab.com"
      - "*.gitlab.com"
      # Package registries
      - "registry.npmjs.org"
      - "*.npmjs.com"
      - "pypi.org"
      - "files.pythonhosted.org"
      - "crates.io"
      - "static.crates.io"
      - "proxy.golang.org"
      - "pkg.go.dev"
      - "rubygems.org"
      - "repo1.maven.org"
      # Docs and Q&A
      - "developer.mozilla.org"
      - "docs.python.org"
      - "readthedocs.org"
      - "*.readthedocs.io"
      - "stackoverflow.com"
      - "*.stackexchange.com"
      - "en.wikipedia.org"
      - "*.wikipedia.org"
      # Search
      - "duckduckgo.com"
      - "*.duckduckgo.com"
      - "www.google.com"
      - "www.bing.com"

setup:
  install:
    - command: "command -v claude >/dev/null 2>&1 || npm install -g @anthropic-ai/claude-code"
      user: "1000"
      description: Install the Claude Code CLI
    - command: "curl -fsSL https://raw.githubusercontent.com/darkquasar/patronus/main/scripts/install.sh | sh -s -- --version v2.7.0"
      user: "1000"
      description: Install patronus v2.7.0
    - user: "1000"
      command: |
        set -e
        export PATH="$HOME/.local/bin:$HOME/.patronus/bin:$PATH"
        patronus install --profile core-profile-cx --target codex --global --deploy --yes --allow-package-installs
        patronus install --profile core --target claude --global --deploy --yes --allow-package-installs
      description: Deploy the Patronus harness for Codex and Claude

agentInstructions:
  content: |
    This sandbox has two agents, each with the Patronus harness:
      - `codex`: the base agent, brokered by the sandbox proxy (core-profile-cx).
      - `claude`: Claude Code (core). Run `claude` and complete `/login` on first use.
    To repair the harness, put ~/.local/bin on PATH and re-run the two
    `patronus install --profile ...` commands from the kit's setup.
