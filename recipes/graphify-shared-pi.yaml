apiVersion: patronus/v2
family: recipe
name: graphify-shared-pi
version: 1.1.0
role: context
summary: "Shared Graphify HTTP client wiring backed by the pinned Pi adapter and Graphify MCP runtime; coordinator-owned startup and snapshot provenance remain separately qualified."
upstream: github.com/Graphify-Labs/graphify
license: Apache-2.0
requires: [pi-mcp-adapter]
# The sibling recipes deliver the adapter and executable, while this recipe owns
# only the HTTP config leaf. Service startup and graph construction are not install effects.
# wire.tools is the default route, not an explicit-target allowlist.
wire:
  method: merge
  actor: patronus
  mcp:
    transport: http
    url: http://127.0.0.1:9122/mcp
  tools: [pi]
