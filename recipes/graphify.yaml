apiVersion: patronus/v2
family: recipe
name: graphify
role: context                      # L4 — Context / Knowledge (whole-corpus code graph)
summary: "Graphify — turns a codebase (code + docs + PDFs + SQL schemas) into a queryable knowledge graph via tree-sitter AST. Installed with uv (heavy deps → build cost lands at install, not mid-task); wired as a stdio MCP server exposing explain/path/query. No vector store; every edge tagged EXTRACTED vs INFERRED."
upstream: github.com/Graphify-Labs/graphify
license: Apache-2.0

# uv installs the graphifyy CLI (which ships the graphify-mcp entrypoint). We wire
# the MCP server, NOT graphify's own `graphify <platform> install` — Patronus
# replicates the always-on nudges natively (graphify-hint hook + graphify-query-first
# instruction) so they are drift-guarded and cleanly removable.
#
# The [mcp] EXTRA is REQUIRED: graphify-mcp imports mcp.server.stdio, and without
# the extra the mcp/starlette/uvicorn deps are absent from the tool venv, so the
# MCP entrypoint dies with ModuleNotFoundError: No module named 'mcp' (the opaque
# -32000 reconnect failure Claude surfaces). The CLI (`graphify query`) works either
# way; only the MCP server needs the extra. The extra rides in the ref (a PEP 508
# requirement string: name[extra]==version → `uv tool install graphifyy[mcp]==0.9.31`).
deliver:
  via: package-manager
  install:
    - manager: uv
      ref: graphifyy[mcp]==0.9.31    # PINNED + [mcp] extra. PyPI latest is 0.9.31 (verified 2026-08-01); the GitHub v1.0.0 tag is NOT on PyPI — do NOT drop the [mcp] extra (breaks the MCP server) or use ==1.0.0 (nonexistent)/bare graphifyy (tracks latest)
  binary: graphify

wire:
  method: merge
  actor: patronus
  mcp:
    transport: stdio
    command: graphify-mcp
    args: []
  tools: [claude, codex, opencode]
