apiVersion: patronus/v2
family: recipe
name: memory-ai-memory
version: 1.0.0
role: memory                               # L3 — default recipe for the memory layer
summary: "Multi-agent memory layer — MCP + CLI, SQLite+FTS5+optional vectors, git-markdown source of truth."
upstream: github.com/akitaonrails/ai-memory
license: MIT

deliver:
  via: docker                              # blessed path: daemon on 127.0.0.1:49374 (multi-platform image)
  # The Docker-free cargo/aur builds were carried as dead fallbacks (never wired —
  # --prefer-system-pkg only warned). Re-add them as via: package-manager install
  # candidates if/when a PM-installed ai-memory is actually supported.

scope:
  marker: ".ai-memory.toml"                # per-repo isolation marker; stable-UUID project scoping
  global: "~/.local/share/ai-memory"

# ai-memory wires ITSELF into each agent — Patronus orchestrates its installers.
# method: exec, actor: external → the run commands are surfaced as ADVISORY
# (display-only) EXEC rows: Patronus prints them for the user to run but does NOT
# execute them, because they invoke the `ai-memory` CLI, which this recipe does not
# deliver (delivery is Docker / opt-in cargo, not a fetched binary). Auto-running
# would error on any machine where ai-memory isn't installed. actor: external drives
# both the advisory and self-managed bits (remove reports them as "not
# auto-revertable"). Shape (computed) = fetch+run.
wire:
  method: exec
  actor: external
  run:
    # Only the MCP server wiring is surfaced here. The lifecycle hooks that
    # ai-memory's `install-hooks` would register are instead shipped as Patronus
    # `ai-memory-*` hook artifacts (each requires: [memory-ai-memory]) — tracked,
    # removable, and wired by the opt-in `ai-memory` profile — so we deliberately
    # do NOT surface `install-hooks` (running it would add untracked duplicates).
    - "ai-memory install-mcp --client {tool} --apply"
  tools: [claude, codex, opencode]

# Optional durable bootstrap facts pre-loaded into the store at install (L1->L3 bridge).
seed: []

# TODO(§5c open): verify the Docker-free cargo/native path on Windows; if it fails,
# auto-fall-back to memory-engram on Windows before making this the unconditional default.
