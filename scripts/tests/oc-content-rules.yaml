# OpenCode (-oc) content rules: the reviewed source of truth read by
# scripts/tests/test_oc_content.py in the catalog gate.
#
# Only rejections and identities live here; no required-content phrases.
# The reader is stdlib-only and accepts this restricted YAML subset, which this
# file must stay within: top-level `key: value` scalars, top-level `key: [flow list]`,
# and one level of nested mapping (two-space indent) whose values are scalars or
# flow lists. Flow-list items and scalars may be bare or double-quoted. A `#`
# comment runs to end of line when it is outside double quotes.
schema_version: 1
suffix: oc
forbidden_tokens:            # substring, case-sensitive, applied to every .md/.yaml/.json under artifacts/*/*-oc
  codex: ["codex exec", "codex mcp", "CODEX_HOME", "config.toml", "AGENTS.override.md", "Codex only"]
  pi: ["pi-subagents", "pi_subagents", "subagents.", "PI_CODING_AGENT_DIR", "~/.pi/agent", "Pi only"]
  claude: ["Agent tool", "Task tool for Claude", "claude --", "CLAUDE.md"]
  collab: ["Collab", "collab mode"]
exempt_paths: ["artifacts/hooks/block-secrets-oc/block-secrets.py", "artifacts/hooks/gitleaks-guard-oc/gitleaks-guard.py", "**/LICENSE", "**/NOTICE"]
neutral_handoffs: [isolated-writer-supervisor, dispatching-parallel-subagents, using-git-worktrees, domain-modeling, ddd-distilled, refactoring-distilled, rust-style-reference]
pinned_scripts:              # checked only when the file exists (presence-aware)
  artifacts/hooks/block-secrets-oc/block-secrets.py: cfd78d4f424b39a7577f52f8a41d1c515ac28a67681b98ca786369dae5a46fa5
