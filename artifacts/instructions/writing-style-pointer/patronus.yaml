apiVersion: patronus/v2
family: artifact
type: instruction
mode: pointer
pointer:
  trigger: "when writing any prose a reader will see — a doc, README, ADR, PR description, commit body, notebook cell, docstring, or a longer message"
  summary: >-
    House style, always on: avoid em-dashes (prefer a comma, parentheses, a colon, or a full stop;
    headings are exempt), and keep commas and full stops OUTSIDE closing quotation marks (`the
    "fail-closed" flag`, not `"fail-closed."`). For prose that reasons or teaches, load the
    writing-style skill.
role: instruction
name: writing-style-pointer
description: "Always-on pointer to the house writing style. Inlines the two always-on mechanics (em-dashes, quote punctuation) so they reach every Slack message and commit body, and points at the writing-style skill for the meaning-led prose rules that govern anything carrying reasoning."
version: 1.0.0
entry: INSTRUCTIONS.md
targets: [claude, codex, opencode]
defaults:
  scope: project
requires: [writing-style]
