apiVersion: patronus/v2
family: artifact
type: instruction
mode: pointer
pointer:
  trigger: "when writing any prose a reader will see — a doc, README, ADR, PR description, commit body, notebook cell, docstring, or a longer message"
  summary: >-
    House style, always on: avoid em-dashes (prefer a comma, parentheses, a colon, or a full stop;
    headings are exempt), and keep commas and full stops OUTSIDE closing quotation marks (`the
    "fail-closed" flag`, not `"fail-closed."`). For reasoning prose, decide the claim,
    ground it in mechanism/consequence, keep actor/action visible, preserve precision
    and cut filler. This self-contained first pass invokes no editorial workflow.
    For a genuine human choice, missing fact or permission ask, load this harness's
    exact decision-clarity skill; missing-fact and permission asks need no invented options.
role: instruction
name: writing-style-pointer
description: "Self-contained house writing first pass: punctuation mechanics plus compact meaning checks. No editorial dependency, worker, ledger or report; full editorial review stays optional and explicit."
version: 1.4.0
entry: INSTRUCTIONS.md
targets: [claude, codex, opencode]
defaults:
  scope: project
