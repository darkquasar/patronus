apiVersion: patronus/v2
family: artifact
type: setting
role: orchestration
name: code-intel-pi-web-researcher-tools
description: "Adds the MCP gateway to the core Pi web-researcher role without replacing other role overrides"
version: 1.0.0
entry: ""
targets: [pi]
defaults:
  scope: global
requires: [pi-subagents, pi-mcp-adapter, serena-shared-pi, graphify-shared-pi]
setting:
  path: subagents.agentOverrides.patronus-web-researcher-pi.tools
  value: [read, bash, web_search, fetch_content, get_search_content, source_check, mcp]
