apiVersion: patronus/v2
family: artifact
type: hook
role: capability
name: skills-heartbeat
description: "Claude-only UserPromptSubmit reminder plus installed-skill names from the hook's own scope. Defaults to project like skills-dispatch-cl and its activation hook. A missing selected directory emits a diagnostic; no other scope is read. Wire as skills-heartbeat@claude."
version: 1.1.0
entry: ""
files: [skills-heartbeat.sh]
targets: [claude]
defaults:
  scope: project
hook:
  event: UserPromptSubmit
  command: "{script}"
  script: skills-heartbeat.sh
