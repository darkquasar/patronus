apiVersion: patronus/v2
family: artifact
type: hook
role: capability
name: language-detect
description: "Language-idiom re-grounding: a SessionStart hook (startup|clear|compact) that inspects root language manifests and points to the codebase's idioms and this host's installed language guidance. It does not name a foreign harness skill or inline a style guide. Conditional on a recognized manifest."
version: 1.0.3
entry: ""
files: [detect-language.sh]
targets: [claude, codex, opencode]
defaults:
  scope: project
hook:
  event: SessionStart
  matcher: startup|clear|compact
  command: "{script}"
  script: detect-language.sh
