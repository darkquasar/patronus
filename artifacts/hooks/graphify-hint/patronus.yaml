apiVersion: patronus/v2
family: artifact
type: hook
role: context
name: graphify-hint
description: "PreToolUse nudge — before a search (a Bash grep/rg/find command, or the native Grep/Glob tools), nudges the agent to prefer `graphify query \"<question>\"` over grepping raw files, when a graphify graph exists and graphify is on PATH. Fails open (never blocks). Native on claude + codex (hooks); on opencode the graphify-query-pointer instruction carries the nudge."
version: 1.0.2
entry: ""
targets: [claude, codex, opencode]
defaults:
  scope: project
requires: [graphify]
hook:
  event: PreToolUse
  matcher: Bash|Grep|Glob
  intent: nudge
  command: >-
    sh -c 'c=$(cat);
    cmd=$(printf "%s" "$c" | jq -r ".tool_input.command // empty" 2>/dev/null);
    pat=$(printf "%s" "$c" | jq -r ".tool_input.pattern // empty" 2>/dev/null);
    hit=;
    case "$cmd" in *grep*|*"rg "*|*"find "*) hit=1 ;; esac;
    [ -n "$pat" ] && hit=1;
    if [ -n "$hit" ] && [ -f graphify-out/graph.json ] && command -v graphify >/dev/null 2>&1;
    then echo "hint: a graphify graph exists — consider graphify query \"<question>\" instead of grepping." >&2; fi;
    exit 0'
