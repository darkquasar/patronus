apiVersion: patronus/v2
family: artifact
type: hook
role: capability
name: work-state-reground
description: "Resume/post-compaction re-grounding — a SessionStart hook (startup|clear|compact) that, at the moments the agent has lost the thread, tells it to reconcile with EXTERNALIZED state before continuing: the Ticket work-graph and the project's lessons. Conditional — it only names a source that is actually present (a `.tickets/` directory for Ticket; a non-empty `docs/lessons/` for lessons), so it never points at a store that isn't there. The lessons cue is the session-start half of the agent-principles Self-Improvement Loop, which writes those files. Pairs with skills-dispatch-activate (which re-injects the skill keystone on the same event). Claude-only today; wire it flavoured as work-state-reground@claude."
version: 1.2.0
entry: ""
files: [reground-work-state.sh]
targets: [claude]
defaults:
  scope: global
hook:
  event: SessionStart
  matcher: startup|clear|compact
  command: "{script}"
  script: reground-work-state.sh
