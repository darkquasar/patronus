  note: "ADAPTED from the upstream `brainstorming` skill (skills/brainstorming/). Patronus re-couplings (per ADR-0001): (1) an explicit ASCII-diagram step at design-presentation points, using the diagram-explain charset — structure gets drawn, not only described; (2) a `grilling` hand-off offered after design approval and before the spec is written, the moment the design is cheapest to change; (3) a `research-team` hand-off at the scope-assessment step for genuinely UNKNOWN (not merely large) domains — decomposition splits work you understand, research-team investigates work you don't. The body otherwise follows upstream; spec-document-reviewer-prompt.md is retained VERBATIM."
