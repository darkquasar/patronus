apiVersion: patronus/v2
family: artifact
type: skill
role: capability
name: writing-like-me
description: "Write in your own voice, editorially clean first. Runs the writing-editorial tiers over a draft (or over a faceless base draft it composes), derives a voice profile from your exemplar corpus, then a spine that owns pressure and a reference route. Two independent writers produce complete drafts, a third fresh editor synthesizes them, and a fourth whole-piece developmental editor deepens earned intellectual fugues while removing axiomatic and list-heavy prose before fidelity and liveness audits. Use WHENEVER the user asks to 'make this sound like me', 'write this in my voice', 'draft this the way I would', or hands over a draft and asks to have it voiced. Ships with EMPTY exemplar files by design: it does nothing useful until you supply a corpus at ~/.claude/patronus/voice/. Requires the writing-editorial skill, which its manifest pulls in automatically."
version: 4.1.0
entry: SKILL.md
files: [short-form.md, long-form.md, weights.md, voice-profile-schema.md, spine.md, audit.md]
targets: [claude]   # Claude-flavoured: orchestrates subagents and calls codex over MCP (`codex mcp-server`). Codex/opencode parity is a separate stream, following the research-team precedent.
defaults:
  scope: project
requires: [writing-editorial]
