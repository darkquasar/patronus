apiVersion: patronus/v2
family: artifact
type: skill
role: capability
name: plan-execute
description: "Execute a written implementation plan, choosing the execution mode by proportionality: does independent per-task review earn its cost for THIS plan? Assesses the plan against hard triggers (security, irreversible state, concurrency, compatibility contract, weak verification, high blast radius) and soft signals, states its choice with citations to the plan sections that drove it, then runs either `solo` (sequential, one context) or `sdd` (fresh implementer subagent per task, independent reviewer after each). Both modes end with an independent whole-branch review. Use when you have a plan to implement and no disjoint file-owning boundaries to split it across a team."
version: 1.3.2
entry: SKILL.md
files: [solo.md, sdd.md, implementer-prompt.md, task-reviewer-prompt.md, scripts, fixtures]
targets: [claude, codex, opencode]
requires: [requesting-code-review]
defaults:
  scope: project
