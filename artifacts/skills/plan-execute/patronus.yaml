  commit: 896224c4b1879920ab573417e68fd51d2ccc9072
  note: "AUTHORED for Patronus, with material derived from two upstream superpowers skills at the pinned commit. SKILL.md and solo.md are authored: the proportionality gate is a Patronus axis with no upstream counterpart (upstream forks on subagent CAPABILITY, this forks on whether independent review earns its cost). sdd.md is authored FROM the upstream `subagent-driven-development` discipline rather than lifted from it, and adds a three-round fix-loop ceiling, a carried-forward contract of prior tasks' interfaces in each implementer brief, and a stop-and-report rule on mid-run dispatch failure. implementer-prompt.md, task-reviewer-prompt.md, and the scripts/ helpers (task-brief, review-package, sdd-workspace) ARE vendored from upstream's subagent-driven-development, unchanged apart from path references (audited: git-read + file-write only, no network or destructive operations). Patronus re-coupling (per ADR-0001): solo.md closes each task with `tk close <id>` when the plan was mirrored into ticket, and both modes end by dispatching the reviewer from the `requesting-code-review` skill, which the requires: edge pulls into the install closure."
