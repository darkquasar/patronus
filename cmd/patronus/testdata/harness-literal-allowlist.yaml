# Reviewed allowlist of the target literals that remain in cmd/patronus and
# internal/{state,remove,lock} after HS-T10 (HS-R5 as amended by a07c50ab/HP-08).
# Site identity: file, enclosing declaration, AST path from the declaration to the
# literal, and the occurrence index of this literal value within the declaration.
# Classes: target-capability (tool pi|codex: a Pi or Codex capability branch, not
# admission or target dispatch), descriptor-construction (the registry data),
# adapter-data (schema enum and native-recipe rules carried by lock/state data),
# legacy-zero-value (the documented zero-value defaults of the leaf policies).
# No capability row may name opencode. TestHarnessNoDispatchLiterals pins these
# bytes by hash; a class change is a review event.
# OC-T4 (OP-13): internal/{adapter,recipe,toolpath,plan,profile,scan} are parsed
# for the "opencode" literal only; every OpenCode site there is an adapter-data
# row (tool rank, flavour and context tables, config-base resolution, the Pi
# import-scan vocabulary, and the declarative-gate branch OC-T5 narrows). The
# registry row counts the descriptor Name and ErrorPrefix.
