# Build without production credentials; publish verified immutable objects before discovery.
name: publish-catalog

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "artifacts/**"
      - "recipes/**"
      - "profiles/**"
      - "adapters/**"
      - "packages/**"
      # The build command compiles the whole CLI and its transitive dependencies.
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "scripts/**"
      # The catalog gate builds this nested tool and reads the compatibility data.
      - "tools/**"
      - "docs/compatibility/**"
      - ".golangci.yml"
      - ".github/workflows/publish-catalog.yml"

permissions:
  contents: read

# Serialize automatic and manual main runs. Never interrupt an active publication.
concurrency:
  group: publish-catalog-production
  cancel-in-progress: false

jobs:
  authorize:
    if: >-
      github.repository == 'darkquasar/patronus' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
      - name: Verify owner-approved merged PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-publication-authorization.py catalog

  build:
    needs: authorize
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # check-versions needs the previous commit as its base.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
      # gofmt, vet and race tests on a scratch copy without artifacts/ or profiles/.
      - name: Application contract gate
        run: bash scripts/tests/application-contract.sh --out "$RUNNER_TEMP/application-gate" --without-catalog
      - name: Select version base
        id: base
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "${BEFORE:-}" ] && git rev-parse --verify --quiet "$BEFORE^{commit}" >/dev/null; then
            echo "rev=$BEFORE" >> "$GITHUB_OUTPUT"
          else
            echo "rev=$(git rev-parse HEAD^)" >> "$GITHUB_OUTPUT"
          fi
      # This job's OWN registry: built, structurally checked, public-CLI locked and
      # publication-contract tested BEFORE the activation guard and any upload.
      - name: Catalog contract gate
        run: bash scripts/tests/catalog-contract.sh --out "$RUNNER_TEMP/catalog-gate" --base "${{ steps.base.outputs.rev }}"
      - uses: actions/upload-artifact@v4
        with:
          name: registry
          path: ${{ runner.temp }}/catalog-gate/registry/
          if-no-files-found: error

  publish:
    needs: [authorize, build]
    if: >-
      github.repository == 'darkquasar/patronus' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      pull-requests: read
    env:
      AWS_DEFAULT_REGION: auto
      AWS_PAGER: ""
      BUCKET: patronus-registry
    steps:
      - uses: actions/checkout@v5
      - name: Recheck owner approval before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-publication-authorization.py catalog
      - uses: actions/download-artifact@v4
        with:
          name: registry
          path: registry/
      - name: Check production catalog activation
        id: guard
        env:
          DIRECTORY_PACKAGES_ENABLED: ${{ vars.DIRECTORY_PACKAGES_ENABLED }}
        run: bash scripts/check-catalog-publication.sh registry >> "$GITHUB_OUTPUT"
      - name: Install pinned AWS CLI
        if: steps.guard.outputs.publish == 'true'
        run: |
          curl --fail --silent --show-error --location \
            https://awscli.amazonaws.com/awscli-exe-linux-x86_64-2.31.0.zip -o /tmp/awscli.zip
          unzip -q /tmp/awscli.zip -d /tmp/patronus-awscli
          sudo /tmp/patronus-awscli/aws/install --update
          aws --version | grep -E '^aws-cli/2\.31\.0 '
      - name: Check current main after acquiring publication job
        if: steps.guard.outputs.publish == 'true'
        id: eligibility
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" ]; then
            echo 'index=true' >> "$GITHUB_OUTPUT"
          else
            echo 'index=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Stale ref: immutable objects may publish, but the discovery index is skipped.'
          fi
      - name: Publish directory packages and sidecars
        if: steps.guard.outputs.publish == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: bash scripts/publish-packages.sh registry

      - name: Publish item tarballs (immutable; check-before-put)
        if: steps.guard.outputs.publish == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          set -euo pipefail
          cd registry
          # Each item tarball key is WRITE-ONCE. For every built tarball:
          #   - if the key is absent → PUT it (record its sha256 as object metadata)
          #   - if present with the SAME sha → skip (already published, identical)
          #   - if present with a DIFFERENT sha → FAIL (immutability violation)
          #   - if present but with NO recorded sha → skip with a warning (assume
          #     intentionally immutable; pre-guard upload)
          find catalog -type f -name '*.tar.gz' | while read -r key; do
            local_sha="$(sha256sum "$key" | cut -d' ' -f1)"
            if meta="$(aws s3api head-object --endpoint-url "$R2_ENDPOINT" \
                  --bucket "$BUCKET" --key "$key" 2>/dev/null)"; then
              remote_sha="$(echo "$meta" | jq -r '.Metadata.sha256 // empty')"
              if [ -z "$remote_sha" ]; then
                echo "WARN: $key already exists without sha metadata; skipping (assumed immutable)"
                continue
              fi
              if [ "$remote_sha" != "$local_sha" ]; then
                echo "IMMUTABILITY VIOLATION: $key exists with sha $remote_sha but build produced $local_sha" >&2
                exit 1
              fi
              echo "skip (already published, identical): $key"
              continue
            fi
            echo "put (new): $key"
            aws s3api put-object --endpoint-url "$R2_ENDPOINT" --bucket "$BUCKET" \
              --key "$key" --body "$key" --content-type application/gzip \
              --metadata "sha256=$local_sha"
          done

      - name: Publish discovery index (mutable; no-cache)
        if: steps.guard.outputs.publish == 'true' && steps.eligibility.outputs.index == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          set -euo pipefail
          # Check again after all immutable uploads, immediately before mutable writes.
          git fetch --no-tags origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo '::notice::Stale ref: main advanced during publication; discovery index is skipped.'
            exit 0
          fi
          cd registry
          for f in catalog/index.json catalog/index.json.sha256; do
            ct="application/json"
            [ "$f" = "catalog/index.json.sha256" ] && ct="text/plain"
            aws s3api put-object --endpoint-url "$R2_ENDPOINT" --bucket "$BUCKET" \
              --key "$f" --body "$f" --content-type "$ct" \
              --cache-control "no-cache, max-age=0"
          done
