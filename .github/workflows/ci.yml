# CI — runs on every push and pull request. Two independent gates:
#   test             application contract: gofmt/vet/race tests on a scratch copy
#                    WITHOUT artifacts/ and profiles/ (synthetic catalogs only)
#   catalog-contract real catalog: public build, catalog-check tool, public-CLI
#                    lock cases, placeholders/gate intent/versions, publication
#                    contract suites and Pi static evidence checks
# Neither gate runs shipped guard/supervisor programs, fake harnesses, native CLIs
# or SDKs; artifact behaviour is deferred and NOT RUN. CONTRIBUTING.md maps each
# failure to its job and the local one-command invocation.
name: ci

on:
  # Every push and every pull request, with no paths filter: a Go-only change still
  # runs the catalog gate and a content-only change still runs the application gate.
  push:
  pull_request:

# The test job runs on EVERY pull_request, INCLUDING from forks, and `go test`
# executes repository code — a fork PR can therefore run arbitrary code here. That is
# safe today ONLY because there is nothing in this workflow to steal: `contents: read`
# and no `secrets.*` anywhere in it.
#
# DECISION (2026-07-12, docs/specs/01-lifecycle-and-test-surface/test-surface-spec.md):
# this stops being safe the instant anyone adds a secret to this workflow. If a secret
# is ever needed, EITHER move the secret-requiring step into a separate, manually
# approved workflow, OR switch that job to pull_request_target guarded by
#   if: github.event.pull_request.head.repo.full_name == github.repository
# Do not add a secret to this job.
#
# The companion rule lives in the tests: no test may fetch remote bytes (cmd/patronus's
# TestMain installs a deny-all fetcher that panics with the URL). A test that pulled
# from raw.githubusercontent.com would execute third-party bytes in this pipeline on
# every PR, before human review.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
      # The scratch copy proves application tests need no production catalog.
      - name: application contract gate
        run: bash scripts/tests/application-contract.sh --out "$RUNNER_TEMP/application-gate" --without-catalog

  # Stable status name: catalog-contract. Requiring it in branch protection is a
  # separate maintainer settings action. Fork PRs run it secret-free (contents:read).
  catalog-contract:
    name: catalog-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
      - name: Select version base
        id: base
        env:
          PR_BASE: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "${PR_BASE:-}" ]; then
            echo "rev=origin/$PR_BASE" >> "$GITHUB_OUTPUT"
          elif [ -n "${BEFORE:-}" ] && git rev-parse --verify --quiet "$BEFORE^{commit}" >/dev/null; then
            echo "rev=$BEFORE" >> "$GITHUB_OUTPUT"
          else
            echo "rev=$(git rev-parse HEAD^)" >> "$GITHUB_OUTPUT"
          fi
      - name: catalog contract gate
        run: bash scripts/tests/catalog-contract.sh --out "$RUNNER_TEMP/catalog-gate" --base "${{ steps.base.outputs.rev }}"

  # Enforces CONTRIBUTING.md's version-bump rule on every pull_request: an artifact
  # whose CONTENT changed must also bump its patronus.yaml version:. Runs only on PRs
  # (a push to main has no base to diff against and is already merged). fetch-depth: 0
  # gives it the full history so origin/main and the merge-base are present; without
  # it the check degrades to silence rather than failing. The R2 write-once catalog
  # keys make a missed bump a DEPLOY failure on main — this moves that signal to
  # review. (pat-3mz5)
  version-bump:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
      - name: check version bumps
        run: go run ./cmd/patronus check-versions --base "origin/${{ github.base_ref }}"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
      # Lints the WHOLE repo against the curated .golangci.yml (debuggability set).
      # golangci-lint v2 is required because go.mod targets Go 1.25 (v1.x is built
      # with an older Go and refuses to analyze a newer-targeted module).
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
