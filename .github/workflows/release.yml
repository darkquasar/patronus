# release — on a v* tag, cross-compiles the binary for every supported platform
# and publishes a GitHub Release with the binaries and their checksums ONLY.
#
# The catalog is NOT shipped here: it lives in the R2 registry, published
# independently by publish-catalog.yml. The tool and the catalog are separate
# tracks on separate cadences (the npm/pip model) — a binary release never
# re-ships catalog content, and a catalog change never re-ships the binary.
#
# The binaries are static (CGO_ENABLED=0) so they run on minimal Linux, native
# Windows, and macOS with zero prerequisites — the "one binary, works anywhere"
# premise. The version is stamped into the binary via -ldflags.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  authorize:
    if: >-
      github.repository == 'darkquasar/patronus' && github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') && github.actor == 'darkquasar' &&
      github.actor_id == '28435534' && github.triggering_actor == 'darkquasar'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify owner-created tag belongs to main history
        run: python3 scripts/check-publication-authorization.py release

  build-binaries:
    needs: authorize
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          out="dist/patronus-${GOOS}-${GOARCH}${ext}"
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "$out" ./cmd/patronus
      - uses: actions/upload-artifact@v6
        with:
          name: bin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  release:
    needs: [authorize, build-binaries]
    if: >-
      github.repository == 'darkquasar/patronus' && github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') && github.actor == 'darkquasar' &&
      github.actor_id == '28435534' && github.triggering_actor == 'darkquasar'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Recheck release authorization
        run: python3 scripts/check-publication-authorization.py release
      - name: Collect binaries
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum patronus-* > checksums.txt
      - name: Capture package-distribution receipt
        id: distribution-receipt
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/distribution/receipt.py capture --dist dist --out "$RUNNER_TEMP/distribution/receipt.json"
      - name: Upload package-distribution receipt
        id: distribution-upload
        if: steps.distribution-receipt.outcome == 'success' && steps.distribution-receipt.outputs.eligible == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: distribution-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/distribution/receipt.json
          if-no-files-found: error
          overwrite: false
      - name: Report package-distribution receipt status
        if: always()
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          CAPTURE_OUTCOME: ${{ steps.distribution-receipt.outcome }}
          UPLOAD_OUTCOME: ${{ steps.distribution-upload.outcome }}
        run: python3 -B scripts/distribution/receipt.py summary --tag "$RELEASE_TAG" --capture "$CAPTURE_OUTCOME" --upload "$UPLOAD_OUTCOME"
      - name: Publish Release (binaries + checksums only)
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/patronus-*
            dist/checksums.txt
